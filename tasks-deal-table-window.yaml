      WHAT THE USER ASKED FOR:
      "add sniper bids and it auto bids on the item at the END of the auction"
      - from the Opportunity Finder deals results table, the one already showing a computed
      "Max to pay" on every eBay auction row.

      WHERE IT STANDS TODAY:
      The app has a full Undervalued Auction Sniper (Services/AuctionSniperAnalyzer.cs, section
      `#snipe-section` in wwwroot/index.html around line 3276, panel around line 1535). Its own
      comment states the rule it was built to: "Read-only - it searches, and nothing else. No bid is
      ever placed by the app." It finds underpriced live auctions and computes the most worth bidding.
      The deals table already shows that figure - on an auction row, "Max to pay" IS the highest bid
      worth making, with buyer's premium and tax already taken out.
      So the analysis and the number both exist. What is missing is arming the bid and firing it.

      FIRST, ESTABLISH WHAT IS ACTUALLY POSSIBLE - do not assume, and do not build against an API
      that will 404:
      eBay has no generally-available API for placing a bid. The Buy Offer API (placeProxyBid) is
      limited-release and almost certainly not granted to this app's keys - check what these
      credentials can really do before designing around it. The app already drives a real logged-in
      browser session for Facebook Marketplace and Terapeak (FacebookMarketplaceService and friends),
      so a browser-session bid against the seller's OWN eBay account is the realistic path if the API
      is not available. Pick whichever genuinely works, and say plainly in the UI which one is in use.

      BUILD THIS - armed from the row, fired at the end of the auction:
        - On any eBay AUCTION row in the results table, an action that arms a snipe. Not on Buy It Now
          rows, not on local/free/liquidation rows - those cannot be bid on.
        - Arming opens a small confirm step pre-filled with that row's computed "Max to pay", which the
          seller can change. Nothing is armed until they confirm an explicit dollar amount.
        - THE BID FIRES AT THE END OF THE AUCTION - a few seconds before close, so rival bidders have
          no time to respond. Make the lead time configurable with a sane default, and account for
          clock skew against eBay's end time rather than the local clock: firing late means losing
          every time, and firing early is just an ordinary bid that gets outbid.
        - It bids at most the armed maximum and then stops. It NEVER raises its own ceiling, never
          re-bids after being outbid, and never bids on an item other than the one armed.
        - Armed snipes are listed somewhere the seller sees them all at once - item, max, end time,
          live countdown - with a one-click cancel that works right up to the moment it fires.
        - Every arm, fire, win, loss, cancel and failure goes to the ActionLog with the amount, so
          there is a record of every dollar the app committed.
        - Armed snipes persist across an app restart. A commitment the seller believes is live must
          actually still be live - or the UI must say plainly that it is not.
        - Update the "no bid is ever placed by the app" comments and any UI copy repeating it, so the
          code stops contradicting what it now does.

      NON-NEGOTIABLE - this feature commits the user's real money:
        - Nothing is ever bid without an explicit per-item confirmation naming the exact maximum.
        - The armed maximum is a hard ceiling. No rounding up, no "one more increment".
        - No bulk arm-everything button. No default-on behaviour anywhere.
        - A failure to fire is reported loudly and immediately. Silently missing a snipe the seller was
          counting on is worse than not shipping the feature.
        - Never store or print eBay credentials; reuse the existing session handling.

      TESTS (in "ING eBay AutoLister.Tests" - 2114 tests currently pass, do not regress):
        - The bid never exceeds the armed maximum, at every rounding boundary.
        - The fire time lands inside the intended window before auction end, including with clock skew.
        - A cancelled snipe does not fire; a snipe whose auction already ended does not fire.
        - Only eBay auction rows offer the action - Buy It Now, local, free and liquidation rows do not.
        - Arming records item id, maximum and end time, and survives a restart.

      VERIFY BEFORE FINISHING:
        - dotnet build and dotnet test both green.
        - node --check "ING eBay AutoLister/wwwroot/app.js" parses clean.
        - The wwwroot files are EMBEDDED RESOURCES in the csproj: rebuild and start
          bin/Debug/net10.0-windows/AutoListerB1.exe (serves http://localhost:9332), then walk the
          arm/cancel flow in the real UI. Do NOT place a real bid to test - exercise the firing path
          against a test double or a dry-run switch, and state in WORK_COMPLETED.md exactly what was
          and was not tested against live eBay.

      Commit on the current branch in the repo's existing message style (imperative, outcome-focused,
      plain English, no "feat:" prefix). Do not push.
