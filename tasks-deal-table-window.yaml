      WHAT THE USER SAID, TWICE, SCRIBBLING OVER THE SCROLLBAR IN A SCREENSHOT:
      "this window sucks - I do not want the scroll bar - make it bigger - has to be cosmetic"

      THE PROBLEM, WITH THE EXACT CAUSES ALREADY LOCATED:
      The Opportunity Finder deals table has FOURTEEN columns (#, Deal, Source, You pay, Resell on
      eBay, Fees, Net profit, Days to cash, ROI, Margin, Max to pay, Offer them, Evidence, Track -
      wwwroot/index.html around line 1477). They do not fit, so:
        - wwwroot/style.css line ~5668: `.fb-arb-table-wrap { overflow-x: auto; }` puts a horizontal
          scrollbar under the table. The user drew over it. It has to go.
        - wwwroot/style.css line ~5675: `.fb-arb-table { min-width: 1040px; }` is what forces the
          overflow in the first place. Its own comment admits it was raised to stop the Evidence cell
          wrapping - that trade was the wrong way round.
        - wwwroot/style.css line ~4364: `.opportunity-overlay-body > * { max-width: 1320px; }` caps
          the results at 1320px even on a wide monitor, so the table is squeezed while the screen has
          room to spare. That cap is why it feels small.
        - The screenshot also shows an inner VERTICAL scrollbar on the results box - a box scrolling
          inside a scrolling page. Find whatever max-height causes it and remove it.
      The right-hand columns are cut off mid-word: the "Offer them" buttons render as "LOI" and
      "What...", clipped at the edge. Every number in that table exists to answer "is this worth
      buying" - a number nobody can see answers nothing.

      DO THIS:
        - NO horizontal scrollbar. Not a prettier one, not a thin one - none. Remove the `overflow-x`
          crutch and the `min-width` that makes it necessary.
        - NO inner vertical scroll box. The page scrolls; the results do not scroll inside a frame.
        - MAKE IT BIGGER. Let the results block use the real width of the window instead of the
          1320px cap - a wide screen should show a wide table. Keep the rest of the overlay's
          layout intact; this is about the results, not every panel.
        - Cut the column count to what a buying decision needs on screen at all times: the item, the
          source, what it costs, what it nets, how fast, the most to pay, and the action. ROI and
          Margin are two views of the same spread; Fees is already inside Net profit; "You pay" and
          "Resell on eBay" are the two ends Net profit spans; Evidence is prose that belongs under the
          row, not in a column. Move that supporting detail into the row's expandable detail area or a
          tooltip. Do NOT delete any figure - every number stays reachable, just not all at once.
        - IT HAS TO LOOK GOOD. This is the screen the seller stares at while deciding where their
          money goes, and the user called out cosmetics specifically:
            * nothing clipped, nothing truncated mid-word, no button cut in half at the edge;
            * numbers right-aligned on a consistent decimal rhythm, the Deal title taking the slack;
            * comfortable row height and padding - it should read as a premium table, not a spreadsheet;
            * the existing row states all survive and still look right: goldmine gold edge, hover,
              striping, `dt-money` emphasis (style.css ~11757-11940), Thin/Worth it/Pass badges;
            * correct in BOTH light and dark themes;
            * still readable on a narrow window - below the width the full table needs, fall back to a
              stacked compact row, never to a sideways scroll.
        - Do not change any figure, calculation, sort or filter. Layout and presentation only.

      TESTS (in "ING eBay AutoLister.Tests" - 2114 tests currently pass, do not regress):
        - Assert the table's column set matches the reduced list, so nobody can quietly add a
          fifteenth column and bring the scrollbar back.
        - Assert every figure removed from a column is still rendered somewhere in the row detail.
        - Assert the stylesheet no longer sets `overflow-x: auto` or a `min-width` on the deals table
          that would reintroduce the horizontal scrollbar.

      VERIFY BEFORE FINISHING:
        - dotnet build and dotnet test both green.
        - node --check "ING eBay AutoLister/wwwroot/app.js" parses clean.
        - The wwwroot files are EMBEDDED RESOURCES in the csproj: rebuild, then start
          bin/Debug/net10.0-windows/AutoListerB1.exe (serves http://localhost:9332), run a search that
          returns 30 rows, and TAKE A SCREENSHOT. Look at it. Confirm with your own eyes: no
          horizontal scrollbar, no inner vertical scrollbar, no clipped column, no half-rendered
          button, and a table that fills the window. Checking the source file alone proves nothing.
          Stop any running AutoListerB1.exe first if the build fails on a locked file.

      Commit on the current branch in the repo's existing message style (imperative, outcome-focused,
      plain English, no "feat:" prefix). Do not push.
