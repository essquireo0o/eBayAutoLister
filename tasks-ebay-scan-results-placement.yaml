      THE PROBLEM:
      On the Opportunity Finder, the "eBay Scanner - buy underpriced on eBay, resell on eBay" panel
      (wwwroot/index.html around line 1249) sits at the top. Its results do NOT appear under it. They
      render in the shared results block `#fb-arb-results` (index.html around line 1427), which lives
      INSIDE the "Local & online deals" panel below it. So a seller types "bitcoin miners", hits
      "Scan eBay", and the answer appears past an entire unrelated panel - source chips, Facebook
      connect banner, zip code, radius, coupon check - none of which had anything to do with the
      search they just ran. The user marked the empty space right below the eBay panel as where the
      results belong.

      This was a deliberate choice once - the comment above the panel says "Results render in the
      shared table below - one scanner engine, two ways to start it" - and the engine sharing is
      correct and should stay. Only the PLACEMENT is wrong.

      DO THIS:
        - Make the results block appear directly beneath the panel that produced it. Scan eBay ->
          results under the eBay panel. Search Local / Find Goldmines -> results under the local
          panel, exactly as now.
        - ONE results block, MOVED - not a second copy. `#fb-arb-results` carries the summary line,
          the warning, the coupon strip, the sort/category/price controls, the three checkboxes,
          "N shown", "Spend a budget on these...", the table and the footnote. Two copies of that would
          drift apart within a week and double every bug. Add an empty host container after the eBay
          panel and relocate the existing node into whichever host matches the search that just ran.
        - Moving a DOM node keeps listeners bound directly to elements inside it, but any handler
          delegated from a PARENT outside `#fb-arb-results` will silently stop firing after the move.
          Check every binding that reaches into the results block - sort, category, price range, the
          checkboxes, the budget button, row clicks, Track buttons - and confirm each still works in
          BOTH positions. This is the thing most likely to break.
        - After a scan finishes, scroll the results into view so the seller sees the answer without
          hunting for it.
        - Make it unambiguous which search the rows belong to. The summary line already names the
          source ("30 deals priced for 'bitcoin miners' ... from eBay (50)") - keep that honest when
          the block moves, and do not leave stale rows from the previous search sitting under a panel
          while a new scan is running.
        - Run one search, then the other: the block moves to the panel that ran most recently and the
          old position is left clean, not with an empty shell or a gap.
