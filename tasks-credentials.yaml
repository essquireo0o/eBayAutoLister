# ---------------------------------------------------------------------------------------------
# claude-queue batch: make every login/connection in ING AutoLister actually work, and prove it
# by running the checks 100 times.
#
# The four connections:
#   1. eBay  OAuth  — relay: eBay -> inglisting.com/api/ebay/callback (PHP) -> localhost:9332
#   2. Facebook Marketplace — real-Chrome Playwright session -> facebook-session.json
#   3. Terapeak  — real-Chrome Playwright session (eBay account login) -> terapeak-session.json
#   4. Hosted sold-comps DB — comps.php on inglisting.com (ing_sold_listings MariaDB)
#
# Run:
#   python C:/Users/nsquires/source/repos/claude-queue/claude-queue.py batch tasks-credentials.yaml
#   python C:/Users/nsquires/source/repos/claude-queue/claude-queue.py worker --save-output
# ---------------------------------------------------------------------------------------------
tasks:

  # ── 1. See the failure before fixing it ─────────────────────────────────────────────────────
  - session: "conn-doctor"
    priority: 20
    max_attempts: 3
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user anything, NEVER wait for input, NEVER stop to
      confirm. Decide and proceed. Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on
      branch auto/queue-features-20260726. Work ONLY in this repo.
      CREDENTIALS EXCEPTION FOR THIS TASK GROUP: you MAY read %LOCALAPPDATA%\ING AutoLister\
      credentials.json, terapeak-session.json and facebook-session.json and USE them to test real
      connections. You must NEVER print, log, echo, commit, or paste any secret value, token,
      cookie, password or API key - report only booleans, string lengths, expiry dates and HTTP
      status codes. Never commit any of those files.
      You CANNOT type the user's password. If a check genuinely requires a human to log in, record
      it as NEEDS-HUMAN. NEVER fake a pass, NEVER weaken a check so it passes.
      BEFORE finishing run BOTH:
        dotnet build "ING eBay AutoLister/ING eBay AutoLister.csproj" -c Debug
        dotnet test  "ING eBay AutoLister.Tests/ING eBay AutoLister.Tests.csproj"
      Fail -> git checkout -- . ; git clean -fd ; STOP. Green -> git add -A && git commit.
      Bump the ?v= in wwwroot/index.html if you changed wwwroot/app.js. Never git push.

      TASK: Build Services/ConnectionDoctor.cs - one service that answers, for each of the four
      connections, "is it connected, and if not, exactly why". Right now failures are silent or
      generic, which is why nobody can tell what is broken.
      For each of eBay OAuth, Facebook session, Terapeak session, and the hosted comps API, return
      a typed result: Name, Connected (bool), State (NotConfigured / NoSession / SessionExpired /
      Unreachable / AuthRejected / Ok), a one-sentence human reason, and a NextAction string.
      Real checks, not "is the file present":
        - eBay: is there a refresh token, is it expiring, does a live token refresh succeed (call
          the existing EbayService refresh path), does an authenticated GET against a cheap Sell
          API endpoint return 200 vs 401.
        - Facebook / Terapeak: load the saved storageState in a headless Playwright context via
          NodeRuntime and confirm the logged-in signal (Facebook: a non-empty c_user cookie plus a
          logged-in page probe; Terapeak: reaching the research page without a login redirect).
        - Hosted comps: issue a real lightweight query against MarketCompsApiUrl and report HTTP
          status + result count. Distinguish "bad key" (401/403) from "unreachable" (timeout/DNS).
      Add endpoint GET /api/diagnostics/connections in Program.cs returning all four.
      Add unit tests in "ING eBay AutoLister.Tests" for the state classification (each State maps
      from a representative input) using fakes - no network in the unit tests.

  # ── 2. Show it to the seller ────────────────────────────────────────────────────────────────
  - session: "conn-doctor-ui"
    priority: 18
    max_attempts: 3
    depends_on: ["conn-doctor"]
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user, NEVER wait, NEVER stop to confirm.
      Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on branch
      auto/queue-features-20260726. Never print/commit any secret, token, cookie or key.
      BEFORE finishing run BOTH:
        dotnet build "ING eBay AutoLister/ING eBay AutoLister.csproj" -c Debug
        dotnet test  "ING eBay AutoLister.Tests/ING eBay AutoLister.Tests.csproj"
      Fail -> git checkout -- . ; git clean -fd ; STOP. Green -> git add -A && git commit.
      Bump ?v= in wwwroot/index.html if app.js changed. Never git push.

      TASK: Put ConnectionDoctor on screen. In wwwroot (index.html + app.js + style.css) add a
      "Connections" panel at the top of Settings that calls GET /api/diagnostics/connections and
      shows one row per connection: name, a clear connected/not state, the exact reason when not
      connected, and a button that starts the right fix (Connect eBay / Connect Facebook /
      Connect Terapeak / Test comps API). Include a "Re-check all" button.
      Rules: a row may only read as connected when the doctor says Connected - never optimistic,
      never "assume ok while loading". Show NEEDS-HUMAN states plainly ("Sign in to Facebook in the
      window that opens"). Match the existing design system - do not invent a second one.
      Never render any secret value; masked presence indicators only.

  # ── 3. eBay OAuth end to end ────────────────────────────────────────────────────────────────
  - session: "ebay-oauth-fix"
    priority: 17
    max_attempts: 3
    depends_on: ["conn-doctor"]
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user, NEVER wait, NEVER stop to confirm.
      Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on branch
      auto/queue-features-20260726. You MAY read credentials.json to test; NEVER print, log or
      commit any token/secret - booleans, lengths, expiries and HTTP codes only. Never publish a
      live eBay listing. Never change the user's API keys.
      BEFORE finishing run BOTH:
        dotnet build "ING eBay AutoLister/ING eBay AutoLister.csproj" -c Debug
        dotnet test  "ING eBay AutoLister.Tests/ING eBay AutoLister.Tests.csproj"
      Fail -> git checkout -- . ; git clean -fd ; STOP. Green -> git add -A && git commit.
      Never git push.

      TASK: Make eBay sign-in work every single time. Trace and fix the whole path in
      Services/EbayService.cs and Program.cs (/api/ebay/auth-url, the relay callback, the
      inglisting.com pickup polling, SaveOAuthTokensFull, the refresh-before-expiry hook near
      Program.cs line 534, and /api/ebay/status).
      Specifically:
        - The relay only ever redirects to http://localhost:9332. Assert at startup that the app is
          actually bound to AppPaths.Port and fail loudly with a fixable message if not.
        - The RuName / redirect_uri / scope set used to build the auth URL must match what the relay
          and eBay expect; if they cannot match, say so in the returned error instead of producing a
          URL that dead-ends.
        - Callback and pickup: handle the user closing the browser, a slow pickup, a reused session
          id, and a relay 4xx/5xx. Today these can leave the UI waiting forever. Give each a bounded
          timeout and a specific error.
        - Tokens must persist to the fixed data home (AppPaths.DataHome) and survive an app restart.
          Refresh must fire before expiry and must not blow away a good refresh token on a transient
          network error - only on an explicit invalid_grant from eBay.
        - Every failure path must produce a distinct, actionable message that the ConnectionDoctor
          surfaces. No silent catch that returns "not connected".
      Add unit tests covering: expiry math, refresh-on-transient-error keeps the old token,
      invalid_grant clears it and reports re-auth needed, and token round-trip persistence.

  # ── 4. Facebook session ─────────────────────────────────────────────────────────────────────
  - session: "facebook-session-fix"
    priority: 16
    max_attempts: 3
    depends_on: ["conn-doctor"]
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user, NEVER wait, NEVER stop to confirm.
      Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on branch
      auto/queue-features-20260726. You may load the saved facebook-session.json to test, but never
      print, log or commit any cookie or its value. Never commit the session file.
      You CANNOT type the user's Facebook password - anything needing that is NEEDS-HUMAN.
      BEFORE finishing run BOTH:
        dotnet build "ING eBay AutoLister/ING eBay AutoLister.csproj" -c Debug
        dotnet test  "ING eBay AutoLister.Tests/ING eBay AutoLister.Tests.csproj"
      Fail -> git checkout -- . ; git clean -fd ; STOP. Green -> git add -A && git commit.
      Never git push.

      TASK: Make the Facebook Marketplace connection stick. In
      Services/FacebookMarketplaceService.cs the session lives at facebook-session.json under
      ContentRootPath; confirm that now resolves to AppPaths.DataHome and route it through AppPaths
      explicitly so a different build can never look in a different folder.
      Fix the capture/reuse loop:
        - Login capture: open real installed Chrome (not Playwright's bundled build), wait for the
          c_user cookie, then write storageState atomically (temp file + replace) so a crash or a
          second instance cannot leave a truncated session file. A zero-byte or unparsable session
          must be treated as NoSession, not as a hard crash.
        - Reuse: every scrape must load the saved storageState and detect the "we got bounced to
          login / checkpoint / 2FA" case explicitly and report SessionExpired with a Reconnect
          action, instead of returning zero results that look like "no listings found".
        - Handle Chrome already running with the same profile, Chrome missing entirely, and the
          Playwright package not installed - each with its own message from FailureTranslator.
        - Timeouts must be bounded; no hang.
      Add unit tests for the session-file state machine (missing / empty / malformed / valid /
      expired-marker) and for the bounced-to-login detection given representative page HTML.

  # ── 5. Terapeak session ─────────────────────────────────────────────────────────────────────
  - session: "terapeak-session-fix"
    priority: 15
    max_attempts: 3
    depends_on: ["conn-doctor"]
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user, NEVER wait, NEVER stop to confirm.
      Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on branch
      auto/queue-features-20260726. You may load terapeak-session.json to test; never print, log or
      commit any cookie or value, never commit the session file. Typing the user's eBay password is
      NEEDS-HUMAN - never fake it.
      BEFORE finishing run BOTH:
        dotnet build "ING eBay AutoLister/ING eBay AutoLister.csproj" -c Debug
        dotnet test  "ING eBay AutoLister.Tests/ING eBay AutoLister.Tests.csproj"
      Fail -> git checkout -- . ; git clean -fd ; STOP. Green -> git add -A && git commit.
      Never git push.

      TASK: Make Terapeak connect and stay connected. Terapeak has no API - it is the user's own
      logged-in eBay account driven through real Chrome, and the session is terapeak-session.json.
      In Services/TerapeakService.cs and Services/TerapeakMarketService.cs:
        - Route the session path through AppPaths.DataHome, and write storageState atomically.
        - After the login window, verify the session actually works by loading the research page
          headlessly before declaring success - do not declare connected just because a file was
          written.
        - On every research call, detect the login-redirect / "sign in to continue" / subscription-
          required page and return SessionExpired with a Reconnect action, instead of an empty
          result set that the pricing code silently treats as "no comps".
        - Give the login window the same reliable focus treatment already used in LoginWindowFocus,
          and bound every wait so nothing hangs forever.
        - Make sure a Terapeak failure degrades to the hosted comps path rather than poisoning the
          price with an empty sample - and that the UI says which source the numbers came from.
      Add unit tests for the session-state machine and the expired-page detection on representative
      HTML.

  # ── 6. The hosted comps database ────────────────────────────────────────────────────────────
  - session: "comps-db-fix"
    priority: 14
    max_attempts: 3
    depends_on: ["conn-doctor"]
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user, NEVER wait, NEVER stop to confirm.
      Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on branch
      auto/queue-features-20260726. You may read MarketCompsApiUrl/MarketCompsApiKey to test the
      connection; NEVER print, log, commit or include the key in any error message, report or URL
      you write down. Never commit credentials.json.
      BEFORE finishing run BOTH:
        dotnet build "ING eBay AutoLister/ING eBay AutoLister.csproj" -c Debug
        dotnet test  "ING eBay AutoLister.Tests/ING eBay AutoLister.Tests.csproj"
      Fail -> git checkout -- . ; git clean -fd ; STOP. Green -> git add -A && git commit.
      Never git push.

      TASK: Make the hosted sold-comps database connection reliable and legible. In
      Services/HostedMarketplaceRepository.cs (HostedMarketplaceClient) and
      Services/ExternalMarketplaceDb.cs:
        - Today every failure is swallowed into log.Add(...) and returns an empty list, so a bad
          key, a down host and a genuinely empty result are indistinguishable. Separate them:
          return a result type that carries Ok / NotConfigured / Unauthorized / Unreachable /
          BadResponse plus the row count, and let callers surface it.
        - Validate configuration up front: URL must be absolute https and reachable; a trailing
          slash, a missing ?key, or a URL pointing at the HTML page instead of comps.php should all
          produce a specific message.
        - Add a bounded retry with backoff for transient network errors (2 retries, jittered), and
          keep the 20s timeout.
        - Add POST /api/diagnostics/comps-test that runs one known-good query and returns status +
          row count + latency, never the key.
        - Tolerate the PHP/PDO shapes already seen: numeric fields as JSON strings, missing fields,
          nulls, an error object instead of results, and a non-JSON body (HTML error page).
      Add unit tests for every one of those response shapes and for the state classification.

  # ── 7. The harness that proves it ───────────────────────────────────────────────────────────
  - session: "connect-soak-harness"
    priority: 13
    max_attempts: 3
    depends_on: ["ebay-oauth-fix", "facebook-session-fix", "terapeak-session-fix", "comps-db-fix"]
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user, NEVER wait, NEVER stop to confirm.
      Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on branch
      auto/queue-features-20260726. Reports must never contain a secret, token, cookie or key.
      BEFORE finishing run BOTH the build and the test commands above (same as other tasks).
      Fail -> revert and STOP. Green -> git add -A && git commit. Never git push.

      TASK: Build tools/connect-soak/ - a repeatable harness that runs the four connection checks
      100 times and writes a verdict, so "it works" stops being an opinion.
      Deliver a PowerShell entry point tools/connect-soak/Invoke-ConnectSoak.ps1 that:
        - starts the app (dotnet run on the real project, port 9332), waits for readiness, and stops
          it cleanly at the end - and detects the "port already in use / another instance" case;
        - runs N iterations (default 100, -Iterations to override) of GET
          /api/diagnostics/connections plus POST /api/diagnostics/comps-test;
        - across the run also exercises restart persistence: at least 5 times, stop and restart the
          app mid-run and confirm every connection is still connected afterwards without any human
          step - a connection that only survives while the process lives is a FAIL;
        - records per-connection pass / fail / needs-human counts, every distinct failure reason,
          p50 and p95 latency, and writes both connect-soak-report.md (human) and
          connect-soak-report.json (machine) into the scratch folder, NOT into the repo;
        - exits non-zero unless every connection is 100/100 pass or explicitly NEEDS-HUMAN.
      NEEDS-HUMAN is an honest outcome for the initial interactive sign-in only. Reusing an already
      saved session must never be NEEDS-HUMAN - if it is, that is a FAIL to be fixed.
      Do not weaken a check to make the number green. Document usage in tools/connect-soak/README.md.

  # ── 8. Run it 100 times, fix what breaks, repeat ────────────────────────────────────────────
  - session: "connect-soak-run"
    priority: 12
    max_attempts: 3
    depends_on: ["connect-soak-harness"]
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user, NEVER wait, NEVER stop to confirm.
      Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on branch
      auto/queue-features-20260726. Never print, log or commit any secret, token, cookie or key.
      Never publish a live eBay listing. Never git push.
      Every commit must still pass:
        dotnet build "ING eBay AutoLister/ING eBay AutoLister.csproj" -c Debug
        dotnet test  "ING eBay AutoLister.Tests/ING eBay AutoLister.Tests.csproj"

      TASK: Actually run the soak and make it pass. Run
      tools/connect-soak/Invoke-ConnectSoak.ps1 -Iterations 100.
      For every failure: find the root cause, fix it in the app (not in the test), rebuild, and run
      the full 100 again. Repeat until every connection is 100/100 pass, or is honestly blocked on a
      human sign-in that no code change can remove.
      Rules: never lower an iteration count, never relax an assertion, never mark a real failure as
      NEEDS-HUMAN to get a green run. Flaky counts as failure - a connection that passes 97/100 is
      broken and the intermittent cause must be found.
      Commit each root-cause fix separately with a message naming what was actually wrong.
      Finish by writing a section in WORK_COMPLETED.md: the final per-connection tally, every root
      cause found and fixed, and anything still genuinely requiring the user - with the exact steps
      the user must take, in plain language, for each remaining item.

  # ── 9. One place to connect everything ──────────────────────────────────────────────────────
  - session: "connect-wizard"
    priority: 10
    max_attempts: 3
    depends_on: ["conn-doctor-ui", "connect-soak-run"]
    working_dir: "C:/Users/nsquires/source/repos/ING eBay AutoLister"
    prompt: |
      GUARDRAILS - FULL AUTONOMY. NEVER ask the user, NEVER wait, NEVER stop to confirm.
      Repo: C:\Users\nsquires\source\repos\ING eBay AutoLister on branch
      auto/queue-features-20260726. Never render or log a secret. Free beta - no paywalls.
      BEFORE finishing run the build and test commands. Fail -> revert and STOP. Green -> commit.
      Bump ?v= in wwwroot/index.html if app.js changed. Never git push.

      TASK: Build one "Connect your accounts" flow that takes a brand-new user from nothing to all
      four connections working, in order, without them ever having to guess.
      One screen, four steps (Anthropic key + eBay, Terapeak, Facebook, comps database). Each step
      shows what it is for in one sentence, a single button to do it, and its live ConnectionDoctor
      state underneath. A step turns green only when the doctor says Connected. If a step fails,
      show the doctor's exact reason and the specific next action - never a generic "failed".
      The flow must be resumable: closing the app mid-way and reopening it returns to the first
      unfinished step, because everything is persisted in AppPaths.DataHome.
      Reachable from the dashboard whenever any connection is not connected, and from Settings
      always. Match the existing design system.
