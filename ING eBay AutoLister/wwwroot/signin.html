<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | ING Listing Engine™</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css?v=130" />
  <!-- Same pre-paint theme resolution as index.html, for the same reason: without it a seller
       who chose dark gets a white flash on the way to every sign-in. -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('ingTheme'); } catch (e) { /* private mode */ }
      var choice = (stored === 'light' || stored === 'dark') ? stored : 'system';
      var dark = choice === 'dark' || (choice === 'system' && window.matchMedia
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-choice', choice);
    })();
  </script>
  <style>
    .auth-page { min-height:100vh; display:grid; place-items:center; padding:32px 20px; background:var(--bg); }
    .auth-card { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border);
                 border-radius:14px; padding:28px; box-shadow:0 12px 32px rgba(0,0,0,.08); }
    .auth-card h1 { font-size:var(--fs-xl); margin:0 0 4px; color:var(--text); letter-spacing:var(--tracking-tight); }
    .auth-sub { font-size:var(--fs-sm); color:var(--text-muted); margin:0 0 22px; }
    .auth-field { display:block; margin-bottom:16px; }
    .auth-field span { display:block; font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--text);
                       margin-bottom:6px; }
    .auth-field input { width:100%; box-sizing:border-box; padding:10px 12px; font-size:var(--fs-base);
                        color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:8px; }
    .auth-submit { width:100%; padding:11px; font-size:var(--fs-base); font-weight:var(--fw-bold);
                   border:0; border-radius:8px; background:var(--gold); color:var(--on-gold); cursor:pointer; }
    .auth-submit[disabled] { opacity:.6; cursor:progress; }
    .auth-msg { display:none; margin:0 0 16px; padding:10px 12px; border-radius:8px; font-size:var(--fs-sm);
                background:var(--danger-tint, #fdecec); color:var(--danger, #a12626); }
    .auth-msg.shown { display:block; }
    .auth-alt { margin:18px 0 0; font-size:var(--fs-sm); color:var(--text-muted); text-align:center; }
    .auth-alt a { color:var(--gold-dark); font-weight:var(--fw-semibold); }
  </style>
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Sign in</h1>
    <p class="auth-sub">ING Listing Engine™</p>

    <p id="auth-error" class="auth-msg" role="alert"></p>

    <form id="signin-form" novalidate>
      <label class="auth-field">
        <span>Email</span>
        <input id="signin-email" type="email" name="email" autocomplete="username" required
               autocapitalize="none" spellcheck="false" />
      </label>
      <label class="auth-field">
        <span>Password</span>
        <input id="signin-password" type="password" name="password" autocomplete="current-password" required />
      </label>
      <button id="signin-submit" class="auth-submit" type="submit">Sign in</button>
    </form>

    <p class="auth-alt">No account yet? <a href="/signup.html">Create one</a></p>
  </main>

  <script>
    (function () {
      var form = document.getElementById('signin-form');
      var error = document.getElementById('auth-error');
      var submit = document.getElementById('signin-submit');

      // Where to land afterwards. The cookie handler puts the page the browser was refused on in
      // ?next=, and anything that is not a path on this same site is ignored — a "next" of
      // https://elsewhere.example or //elsewhere.example would make this form a way to bounce
      // people off the product to somewhere that looks like it.
      function destination() {
        var next = new URLSearchParams(location.search).get('next') || '';
        return (next.charAt(0) === '/' && next.charAt(1) !== '/' && next.charAt(1) !== '\\') ? next : '/';
      }

      function show(message) {
        error.textContent = message;
        error.classList.add('shown');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        error.classList.remove('shown');
        submit.disabled = true;

        try {
          var response = await fetch('/api/auth/sign-in', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('signin-email').value,
              password: document.getElementById('signin-password').value
            })
          });
          var body = await response.json().catch(function () { return {}; });

          if (response.ok) { location.replace(destination()); return; }
          show(body.error || 'Could not sign in. Please try again.');
        } catch (e) {
          show('Could not reach the server: ' + e.message);
        }
        submit.disabled = false;
      });
    })();
  </script>
</body>
</html>
